# cmdash default configuration (schema version 1)
# Copy this file to ~/.config/cmdash/config.toml and customize it.
#
# Every dashboard item is one of two types:
#   terminal - a live PTY session (as before)
#   widget   - a shell script whose stdout renders into the surface
version = 1

[workspace]
name = "default"

[appearance]
theme = "inherit"

# Motion is opt-in; see docs/ANIMATION.md for timing and accessibility options.
[animation]
enabled = false

# Local automation is disabled by default; see docs/API.md before enabling it.
[api]
enabled = false

# A widget is a shell script run directly by the dashboard. `command` is
# required; stdout renders into the surface and stderr becomes a diagnostic.
[[workspace.widgets]]
id = 1
type = "widget"
title = " clock "
command = "date +%H:%M:%S"

[workspace.widgets.settings]
mode = "interval"
interval_ms = "1000"

[[workspace.widgets]]
id = 2
type = "widget"
title = " system "
command = "uname -sm"

[workspace.widgets.settings]
mode = "interval"
interval_ms = "60000"

[[workspace.widgets]]
id = 3
type = "terminal"
title = " shell "
command = "/bin/sh"

[[workspace.overlays]]
id = 9
x = 2
y = 4
width = 30
height = 4
z_index = 10
title = " notice "
text = "Script-driven widgets"

[workspace.layout]
type = "stack"
children = [
  { type = "tabs", active = 0, children = [
    { type = "columns", children = [
      { type = "leaf", widget = 1 },
      { type = "leaf", widget = 2 },
      { type = "leaf", widget = 3 }
    ] }
  ] },
  { type = "overlay", overlay = 9 }
]
