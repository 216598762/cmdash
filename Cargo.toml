[package]
name = "cmdash"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A modular terminal dashboard and multiplexer"
license = "MIT"
readme = "README.md"

[features]
default = []
sixel = []

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
crossterm = "0.29"
portable-pty = "0.9"
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-width = "0.2"
