[package]
name = "cmdash"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A modular terminal dashboard and multiplexer"
license = "MIT"
readme = "README.md"

[features]
default = []
sixel = []
wasm-plugins = ["dep:wasmtime"]

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "5"
flate2 = "1"
gif = { version = "0.14", default-features = false, features = ["std"] }
libc = "0.2"
png = { version = "0.17", default-features = false }
portable-pty = "0.9"
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
unicode-width = "0.2"
wasmtime = { version = "47.0.3", default-features = false, features = ["cranelift", "runtime", "wat"], optional = true }
