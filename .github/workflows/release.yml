name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package Linux binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build locked release binary
        run: cargo build --locked --release

      - name: Assemble archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          archive="cmdash-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${archive}"
          cp target/release/cmdash README.md LICENSE "dist/${archive}/"
          cp -R docs "dist/${archive}/docs"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          sha256sum "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmdash-${{ github.ref_name }}-linux
          path: dist/*
          if-no-files-found: error
