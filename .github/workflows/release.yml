name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build locked release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
        shell: bash

      - name: Assemble archive and checksum
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          case "${TARGET}" in
            *windows*) binary="target/${TARGET}/release/cmdash.exe" ;;
            *) binary="target/${TARGET}/release/cmdash" ;;
          esac
          archive="cmdash-${VERSION}-${TARGET}"
          mkdir -p "dist/${archive}"
          cp "${binary}" README.md LICENSE "dist/${archive}/"
          cp -R docs "dist/${archive}/docs"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          sha256sum "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
        shell: bash

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmdash-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
