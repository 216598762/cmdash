name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, check, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Typecheck all targets
        run: cargo check --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  linux-release:
    name: Build Linux release binary
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build locked Linux release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package Linux release binary
        env:
          VERSION: ${{ github.sha }}
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -eu
          archive="cmdash-${VERSION}-${TARGET}"
          mkdir -p "dist/${archive}"
          cp "target/${TARGET}/release/cmdash" README.md LICENSE "dist/${archive}/"
          cp -R docs "dist/${archive}/docs"
          cp -R config "dist/${archive}/config"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          sha256sum "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmdash-linux-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  fuzz-smoke:
    name: Fuzz parser and migration smoke tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run bounded fuzz smoke tests
        run: |
          cargo fuzz run config_parse fuzz/corpus/config_parse -- -runs=1000
          cargo fuzz run plugin_manifest fuzz/corpus/plugin_manifest -- -runs=1000
          cargo fuzz run kitty_stream fuzz/corpus/kitty_stream -- -runs=1000
          cargo fuzz run sixel_rgb -- -runs=1000

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmdash-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  feature-variants:
    name: Validate optional release variants
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sixel variant
        run: cargo build --locked --release --features sixel

      - name: Build WASM plugin variant
        run: cargo build --locked --release --features wasm-plugins

  msrv:
    name: Check Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Check minimum supported Rust version
        run: cargo check --locked --all-targets --all-features

      - name: Run tests on minimum supported Rust version
        run: cargo test --locked --all-targets --all-features
